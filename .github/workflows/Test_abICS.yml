# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test for abICS

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 on 1st and 15th every month

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
        numpy-version: ['1.20.0', '1.26.4', 'latest']
        testname: [Unit, Sampling, ActiveLearnAenet, ActiveLearnNequip, ActiveLearnMLIP-3]
        exclude:
          - python-version: '3.13'
            numpy-version: '1.20.0'
          # nequip 0.6.2 (the pinned version) calls the removed numpy.in1d and
          # therefore requires numpy<2, but Python 3.13 has no numpy 1.x wheels.
          # This is an upstream nequip/numpy-2 incompatibility, not an abICS bug,
          # so skip the nequip integration test on Python 3.13.
          #
          # NOTE for developers: as a result the nequip path is only exercised on
          # Python 3.9 (install_nequip.sh pins numpy<2 for that environment); there
          # is no numpy-2 / Python 3.13 coverage for nequip. Restoring it requires
          # migrating the abICS nequip solver/trainer to nequip >=0.7 (a backwards-
          # incompatible rewrite). See the nequip cap in pyproject.toml.
          - python-version: '3.13'
            testname: ActiveLearnNequip
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install setuptools wheel
        sudo apt update
        sudo apt install -y libopenmpi-dev openmpi-bin parallel
        sudo apt install -y python3-mpi4py
        if [ "${{ matrix.numpy-version }}" = "latest" ]; then
          python -m pip install numpy
        else
          python -m pip install numpy==${{ matrix.numpy-version }}
        fi
        python -m pip install Cython
    - name: Install abICS
      run: python -m pip install .
    - name: Test ${{ matrix.testname }}
      run: |
        case "${{ matrix.testname }}" in
        Unit ) python -m unittest ;;
        Sampling ) cd tests/integration/mock
                   sh ./run.sh
                   cd ../potts
                   sh ./run.sh
                   cd ../potts_pamc
                   sh ./run.sh
                   ;;
        ActiveLearnAenet ) cd tests/integration/active_learn_aenet
                           sh ./install_aenet.sh
                           sh ./run.sh ;;
        ActiveLearnNequip ) cd tests/integration/active_learn_nequip
                            sh ./install_nequip.sh
                            sh ./run.sh ;;
        ActiveLearnMLIP-3 ) cd tests/integration/active_learn_mlip3
                            sh ./install_mlip3.sh
                            sh ./run.sh ;;
        * ) echo "Unknown testname";;
        esac
